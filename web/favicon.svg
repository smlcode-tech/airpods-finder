<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14203a"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.36" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#2f8cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e2ee"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <!-- ses dalgaları: kulaklıktan sağ üste yayılan sinyal -->
  <g fill="none" stroke-linecap="round">
    <path d="M 300 116 A 124 124 0 0 1 324 290" stroke="#2f8cff" stroke-width="28"/>
    <path d="M 334 54 A 190 190 0 0 1 382 330" stroke="#2f8cff" stroke-width="24" stroke-opacity=".7"/>
    <path d="M 370 -2 A 256 256 0 0 1 440 372" stroke="#2f8cff" stroke-width="20" stroke-opacity=".4"/>
  </g>
  <!-- AirPod: kafa + sap -->
  <g transform="rotate(-14 200 230)">
    <rect x="186" y="214" width="56" height="226" rx="28" fill="url(#pod)"/>
    <ellipse cx="196" cy="196" rx="78" ry="84" fill="url(#pod)"/>
    <ellipse cx="166" cy="190" rx="26" ry="30" fill="#0e1626"/>
    <rect x="200" y="404" width="28" height="22" rx="8" fill="#b8c4d4"/>
  </g>
</svg>
